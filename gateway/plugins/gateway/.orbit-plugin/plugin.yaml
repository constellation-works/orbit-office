# Orbit plugin manifest (schemaVersion 2) for the `gateway` plugin:
# audited, redacted API requests through user-granted connections
# (docs/design/office/specs/gateway.md).
#
# The backend is Python 3.12 standard library only. The shared package
# (gateway/src/orbit_gateway) is copied into lib/ by `make -C gateway export`;
# validate and test the export, not this directory.
schemaVersion: 2
kind: Plugin
metadata:
  name: gateway
  version: 0.1.0
  description: >-
    API requests through named connections the user grants: the secret stays
    in a declared slot and never reaches the agent, GET and HEAD run directly,
    writes are drafted for the user's approval and sent once, every response
    is redacted and every call is audited.
  homepage: https://github.com/constellation-works/orbit-office
spec:
  requires:
    orbit: ">=0.34.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    # Enabling records the install's interpreter; the backend refuses an
    # interpreter older than 3.12 with `python_too_old`.
    programs: [python3]

  backend:
    type: exec
    command: bin/backend.py
    timeout_ms: 150000
    sandbox: default

  permissions:
    # `{{workspace}}/.orbit-gateway` only stages a draft's task artifact for
    # orbit.task.artifact.put, which reads files inside the workspace; the
    # file is removed once the put returns.
    fs:
      read: ["{{plugin_state}}", "{{workspace}}/.orbit-gateway"]
      write: ["{{plugin_state}}", "{{workspace}}/.orbit-gateway"]
    # Connections name arbitrary hosts; each request stays under its
    # connection's base_url (enforced in code).
    network: any
    # http-draft files its approval task and artifact; http-send checks the
    # task is still open and closes it. Never retried automatically.
    orbit_tools:
      - orbit.task.add
      - orbit.task.artifact.put
      - orbit.task.show
      - orbit.task.update

  # Orbit plugin secrets are names fixed in the manifest, so connections take
  # one of sixteen slots. `gateway.connection-put` assigns a free slot and
  # never takes a value; the app sets it with
  # `orbit plugin secret set gateway <slot>` (value on stdin).
  secrets:
    - name: conn_01
      description: Secret for the connection assigned slot conn_01 (gateway.connection-list names it).
      rotatable: false
    - name: conn_02
      description: Secret for the connection assigned slot conn_02 (gateway.connection-list names it).
      rotatable: false
    - name: conn_03
      description: Secret for the connection assigned slot conn_03 (gateway.connection-list names it).
      rotatable: false
    - name: conn_04
      description: Secret for the connection assigned slot conn_04 (gateway.connection-list names it).
      rotatable: false
    - name: conn_05
      description: Secret for the connection assigned slot conn_05 (gateway.connection-list names it).
      rotatable: false
    - name: conn_06
      description: Secret for the connection assigned slot conn_06 (gateway.connection-list names it).
      rotatable: false
    - name: conn_07
      description: Secret for the connection assigned slot conn_07 (gateway.connection-list names it).
      rotatable: false
    - name: conn_08
      description: Secret for the connection assigned slot conn_08 (gateway.connection-list names it).
      rotatable: false
    - name: conn_09
      description: Secret for the connection assigned slot conn_09 (gateway.connection-list names it).
      rotatable: false
    - name: conn_10
      description: Secret for the connection assigned slot conn_10 (gateway.connection-list names it).
      rotatable: false
    - name: conn_11
      description: Secret for the connection assigned slot conn_11 (gateway.connection-list names it).
      rotatable: false
    - name: conn_12
      description: Secret for the connection assigned slot conn_12 (gateway.connection-list names it).
      rotatable: false
    - name: conn_13
      description: Secret for the connection assigned slot conn_13 (gateway.connection-list names it).
      rotatable: false
    - name: conn_14
      description: Secret for the connection assigned slot conn_14 (gateway.connection-list names it).
      rotatable: false
    - name: conn_15
      description: Secret for the connection assigned slot conn_15 (gateway.connection-list names it).
      rotatable: false
    - name: conn_16
      description: Secret for the connection assigned slot conn_16 (gateway.connection-list names it).
      rotatable: false

  tools:
    - name: http-get
      description: >-
        GET or HEAD through a named connection. Returns the status, content
        type, a fixed set of headers and the body (JSON parsed, text as text,
        anything else as size and SHA-256), redacted, cut at the connection's
        max_response_bytes. Only Accept, Accept-Language, If-None-Match,
        If-Modified-Since and Range may be set. Use this instead of curl.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/http-get.request.json }
      output_schema: { $ref: schemas/http-get.response.json }

    - name: http-draft
      description: >-
        Draft a write (POST, PUT, PATCH or DELETE, as the connection's drafts
        allow) for the user's approval. Nothing is sent: the request is stored
        with its SHA-256 and filed as one task tagged gateway-draft, which the
        user approves or dismisses. A body holding a secret is refused. Takes
        the same input as http-get plus `body`; Content-Type, If-Match and
        If-Unmodified-Since may also be set.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/http-draft.request.json }
      output_schema: { $ref: schemas/http-draft.response.json }

    - name: http-send
      description: >-
        Send an approved draft, once. Takes the draft id and the SHA-256 the
        user approved; a changed, dismissed or already-sent draft is refused.
        A lost reply after sending is outcome_unknown and never retried.
        Called by the app's Approve, never by an agent.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/http-send.request.json }
      output_schema: { $ref: schemas/http-send.response.json }

    - name: connection-list
      description: >-
        List the connections the user granted: names, base URLs, methods and
        whether each secret slot is set (never a value).
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/connection-list.request.json }
      output_schema: { $ref: schemas/connection-list.response.json }

    - name: connection-put
      description: >-
        Create or replace a connection and assign it a free secret slot. Takes
        no secret. Called by the app's Settings, never by an agent.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/connection-put.request.json }
      output_schema: { $ref: schemas/connection-put.response.json }

    - name: audit-list
      description: >-
        The gateway's audit of API calls, newest first: who called, what was
        requested and what came back (never a body).
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/audit-list.request.json }
      output_schema: { $ref: schemas/audit-list.response.json }

  skills: [skills/api-requests]

  tests: [tests/conformance/*.yaml]
