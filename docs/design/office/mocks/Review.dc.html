<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Review — Orbit Office</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0b0d10}
a{color:#7aa7ff}a:hover{color:#a9c6ff}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #0b0d10; color: #e7eaee; font-family: Geist, ui-sans-serif, system-ui, sans-serif">
<nav aria-label="Office" style="flex: 1 0 232px; box-sizing: border-box; padding: 20px 12px; background: #0e1115; border-right: 1px solid #22272e; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; font-weight: 600; font-size: 15px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="#7aa7ff" stroke-width="1.5"><circle cx="10" cy="10" r="7"></circle><circle cx="10" cy="10" r="2.5"></circle></svg>
<span>Orbit Office</span>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 10px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b95a3">{{g.label}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="{{it.style}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d0}}"></path><path d="{{it.d1}}"></path></svg>
<span style="flex: 1">{{it.t}}</span>
<span style="{{it.countStyle}}">{{it.count}}</span>
</a>
</sc-for>
</div>
</sc-for>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px">
<div style="max-width: 1120px; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<aside style="flex: 1 1 240px; min-width: 0; border: 1px solid #22272e; border-radius: 10px; background: #121519">
<h2 style="margin: 0; padding: 12px 16px; border-bottom: 1px solid #1b1f25; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b95a3; font-weight: 500">Reviews</h2>
<sc-for list="{{reviews}}" as="r" hint-placeholder-count="3">
<a href="#" style="{{r.style}}"><span style="font-size: 14px">{{r.t}}</span><span style="font-size: 12px; color: #8b95a3">{{r.when}}</span></a>
</sc-for>
</aside>
<article style="flex: 999 1 560px; min-width: 0; border: 1px solid #22272e; border-radius: 10px; background: #121519; padding: 24px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; color: #8b95a3">Quarterly review · Q4 so far · simulated history</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 600">From decided to shipped</h1>
<span style="font-size: 13px; color: #a3acb8">Generated today 08:05 by Muse Spark 1.3 · 12 citations</span>
</div>
<button type="button" style="min-height: 40px; padding: 0 14px; border-radius: 6px; background: transparent; color: #e7eaee; border: 1px solid #2c333d; font: inherit; font-size: 14px; cursor: pointer">Regenerate</button>
</div>
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 600">{{s.h}}</h2>
<sc-for list="{{s.lines}}" as="l" hint-placeholder-count="2">
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #d4d9e0">{{l.text}} <a href="{{l.href}}" style="font-size: 12px; font-family: 'Geist Mono', ui-monospace, monospace; text-decoration: none">[{{l.cite}}]</a></p>
</sc-for>
</section>
</sc-for>
</article>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
var FILES={today:'Main.dc.html',calendar:'Calendar.dc.html',todos:'Todos.dc.html',agents:'Agents.dc.html',scribe:'Scribe.dc.html',library:'Library.dc.html',source:'Source.dc.html',insights:'Insights.dc.html',review:'Review.dc.html',routines:'Routines.dc.html',settings:'Settings.dc.html'};

function rail(active){return GROUPS.map(function(g){return {label:g[0],items:g[1].map(function(id){var on=id===active;var ic=ICONS[id];return {t:NAMES[id],href:FILES[id],d0:ic[0],d1:ic[1],count:COUNTS[id]||'',countStyle:(id==='today'?'font-size:12px;padding:2px 8px;border-radius:999px;background:#2a2112;color:#f2d29b':'font-size:12px;color:#8b95a3'),style:'display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px 0 '+(NESTED[id]?'30px':'10px')+';border-radius:6px;text-decoration:none;font-size:14px;'+(on?'background:#18202e;color:#e7eaee;font-weight:500':'color:#a3acb8')};})};});}

class Component extends DCLogic {

return {

sections: [
{h:'What shipped',lines:[
{text:'Three small fixes from the 2 November eng sync merged overnight, each reviewed by a second Muse crew before landing.',cite:'lantern#14–16',href:'Agents.dc.html'},
{text:'The uploader moved halfway to the v2 ingest API; the rest is in progress with a draft PR.',cite:'ORB-L17',href:'Agents.dc.html'}

]},
{h:'What still needs you',lines:[
{text:'Two of your to-dos from the sync are open: the runbook review and the AD group request.',cite:'lantern-sync #t=00:02:40',href:'Todos.dc.html'}
]}
]
};
}
}
</script>
</body>
</html>
