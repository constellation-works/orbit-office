<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Routines — Orbit Office</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#0b0d10}
a{color:#7aa7ff}a:hover{color:#a9c6ff}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #0b0d10; color: #e7eaee; font-family: Geist, ui-sans-serif, system-ui, sans-serif">
<nav aria-label="Office" style="flex: 1 0 232px; box-sizing: border-box; padding: 20px 12px; background: #0e1115; border-right: 1px solid #22272e; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 10px; font-weight: 600; font-size: 15px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="#7aa7ff" stroke-width="1.5"><circle cx="10" cy="10" r="7"></circle><circle cx="10" cy="10" r="2.5"></circle></svg>
<span>Orbit Office</span>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 0 10px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b95a3">{{g.label}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="{{it.style}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d0}}"></path><path d="{{it.d1}}"></path></svg>
<span style="flex: 1">{{it.t}}</span>
<span style="{{it.countStyle}}">{{it.count}}</span>
</a>
</sc-for>
</div>
</sc-for>
</nav>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px">
<div style="max-width: 1120px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600">Routines</h1>
<p style="margin: 0; font-size: 15px; color: #a3acb8">What runs without you, when it runs next, and how it went last time.</p>
</header>
<section aria-labelledby="track-h" style="border: 1px solid #22272e; border-radius: 10px; background: #121519; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
<h2 id="track-h" style="margin: 0; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b95a3; font-weight: 500">Next hour</h2>
<div style="position: relative; height: 40px">
<div style="position: absolute; top: 19px; left: 0; right: 0; height: 2px; background: #22272e"></div>
<sc-for list="{{marks}}" as="m" hint-placeholder-count="4">
<span title="{{m.label}}" style="{{m.style}}"></span>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #8b95a3; font-family: 'Geist Mono', ui-monospace, monospace"><span>08:15</span><span>08:45</span><span>09:15</span></div>
</section>
<sc-for list="{{tables}}" as="tb" hint-placeholder-count="2">
<section style="border: 1px solid #22272e; border-radius: 10px; background: #121519; overflow-x: auto">
<h2 style="margin: 0; padding: 12px 18px; border-bottom: 1px solid #1b1f25; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8b95a3; font-weight: 500">{{tb.label}}</h2>
<div style="min-width: 760px">
<div style="display: grid; grid-template-columns: 64px 2fr 1.4fr 1fr 1.4fr; gap: 12px; padding: 8px 18px; border-bottom: 1px solid #1b1f25; font-size: 12px; color: #8b95a3">
<span>On</span><span>Routine</span><span>When it runs</span><span>Next</span><span>Last time</span>
</div>
<sc-for list="{{tb.rows}}" as="r" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 64px 2fr 1.4fr 1fr 1.4fr; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid #1b1f25">
<label style="display: inline-flex; align-items: center; min-height: 44px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden">{{r.name}} on</span><input type="checkbox" checked="{{r.on}}" style="width: 36px; height: 20px; accent-color: #63d297"></label>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px">{{r.name}}</span><span style="font-size: 12px; color: #8b95a3">{{r.what}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px">{{r.when}}</span><span style="font-size: 12px; color: #8b95a3; font-family: 'Geist Mono', ui-monospace, monospace">{{r.cron}}</span></div>
<span style="font-size: 13px; color: #a3acb8">{{r.next}}</span>
<span style="{{r.lastStyle}}">{{r.last}}</span>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
var FILES={today:'Main.dc.html',calendar:'Calendar.dc.html',todos:'Todos.dc.html',agents:'Agents.dc.html',library:'Library.dc.html',source:'Source.dc.html',insights:'Insights.dc.html',review:'Review.dc.html',routines:'Routines.dc.html',settings:'Settings.dc.html'};
var NAMES={today:'Today',calendar:'Calendar',todos:'To-dos',agents:'Agent work',library:'Library',source:'Source',insights:'Insights',review:'Review',routines:'Routines',settings:'Settings'};
var DOT='M10 9.2a.8.8 0 1 0 0 1.6.8.8 0 0 0 0-1.6z';
var ICONS={today:['M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z','M10 2.5v1.5M10 16v1.5M2.5 10H4M16 10h1.5M4.7 4.7l1 1M14.3 14.3l1 1M4.7 15.3l1-1M14.3 5.7l1-1'],calendar:['M4 5h12v11.5H4z','M4 8.5h12M7.5 3v3.5M12.5 3v3.5'],todos:['M3.5 5.5l1.5 1.5 2.5-2.5M10.5 6h6M3.5 12.5l1.5 1.5 2.5-2.5','M10.5 13h6'],agents:['M6.5 9.5h7V14a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2z','M10 9.5V7M10 5.2v.6M8.3 12.3v.8M11.7 12.3v.8'],library:['M4 4h5a2 2 0 0 1 2 2v10a2 2 0 0 0-2-2H4z','M16 4h-5a2 2 0 0 0-2 2v10a2 2 0 0 1 2-2h5z'],source:[DOT,''],insights:['M5 16v-6M10 16V4M15 16V8','M2.5 16.5h15'],review:[DOT,''],routines:['M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14z','M10 6v4l3 2'],settings:['M4 6h12M4 10h12M4 14h12','M8 4.4a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM13 8.4a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z']};
var GROUPS=[['Work',['today','calendar','todos','agents']],['Knowledge',['library','source']],['Observe',['insights','review']],['Manage',['routines','settings']]];
var NESTED={source:1,review:1};
var COUNTS={today:'1',todos:'2',agents:'1',routines:'6/9'};
function rail(active){return GROUPS.map(function(g){return {label:g[0],items:g[1].map(function(id){var on=id===active;var ic=ICONS[id];return {t:NAMES[id],href:FILES[id],d0:ic[0],d1:ic[1],count:COUNTS[id]||'',countStyle:(id==='today'?'font-size:12px;padding:2px 8px;border-radius:999px;background:#2a2112;color:#f2d29b':'font-size:12px;color:#8b95a3'),style:'display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px 0 '+(NESTED[id]?'30px':'10px')+';border-radius:6px;text-decoration:none;font-size:14px;'+(on?'background:#18202e;color:#e7eaee;font-weight:500':'color:#a3acb8')};})};});}
var LAST={ok:'#a6e8c3',warn:'#f2d29b',none:'#8b95a3'};
function r(on,name,what,when,cron,next,last,tone){return {on:on,name:name,what:what,when:when,cron:cron,next:next,last:last,lastStyle:'font-size:13px;color:'+LAST[tone]};}
function mk(pct,hollow,label){return {label:label,style:'position:absolute;top:12px;left:'+pct+'%;width:16px;height:16px;border-radius:50%;box-sizing:border-box;'+(hollow?'border:2px solid #8b95a3;background:#121519':'background:#5cc8f0')};}
class Component extends DCLogic {
renderVals() {
return {
groups: rail('routines'),
marks: [mk(0,false,'08:15 Meeting inbox'),mk(25,false,'08:30 Meeting inbox'),mk(50,true,'08:45 Signals scan (paused)'),mk(75,false,'09:00 Meeting prep'),mk(97,false,'09:15 Meeting inbox')],
tables: [
{label:'On',rows:[
r(true,'Meeting inbox','Transcribes new recordings, extracts decisions and to-dos','Every 15 minutes','*/15 * * * *','08:15','Ran 08:00 · 1 meeting processed','ok'),
r(true,'Daily digest','Writes the morning digest since your last meeting','Every day at 07:30','30 7 * * *','Tomorrow 07:30','Ran 07:30 · digest ready','ok'),
r(true,'Meeting prep','Drafts a cited brief for meetings with an agenda','Every hour on weekdays','0 * * * 1-5','09:00','Ran 08:00 · 1 brief','ok'),
r(true,'Contradiction check','Compares new decisions with the ledger','Weekly on Monday','0 9 * * 1','Mon 9 Nov','Found 1 contradiction','warn')
]},
{label:'Paused',rows:[
r(false,'Signals scan','Proposes routines from repeated manual work','Every 30 minutes','*/30 * * * *','Skipped while paused','Last ran Fri','none'),
r(false,'KT inbox','Processes knowledge-transfer videos','Every 15 minutes','*/15 * * * *','Skipped while paused','Never ran','none')
]}
]
};
}
}
</script>
</body>
</html>
