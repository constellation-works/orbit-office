[package]
name = "office-models"
description = "Model adapters for the office plugin: Meta Model API (Muse Spark, Muse Voice Transcribe) and the private route (Muse Spark Open on the endpoint the user chose), behind office-core ports, with privacy routing. The only crate that speaks HTTP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "office_models"
path = "src/lib.rs"

[dependencies]
base64 = { workspace = true }
jsonschema = { workspace = true }
office-common = { workspace = true }
office-core = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[lints]
workspace = true
