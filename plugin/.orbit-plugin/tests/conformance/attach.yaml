schemaVersion: 1
kind: PluginTest
tests:
  # Runs after 00-init.yaml, so the Library exists for these refusals. Each one
  # copies nothing: the task refusal reads a task and the input refusals stop
  # before any copy. The dry-run success case is not pinned here: its output
  # carries the Library's git commit, which differs on every run.
  # crates/office-tools/src/tools/tests/attach.rs covers the dry run.
  - name: attach_refuses_an_unknown_task_before_any_copy
    tool: attach
    input: {task: ORB-00000000}
    expect:
      error: {code: task_not_found}
  - name: attach_refuses_a_copy_without_a_task
    tool: attach
    input: {text: "Acme review"}
    expect:
      error: {code: invalid_argument}
  - name: attach_refuses_unknown_input
    tool: attach
    input: {task: ORB-00000000, limit: 3}
    expect:
      error: {code: invalid_argument}
