# Offline empty Orbit/Library history is provided by the public-dispatch
# fixture runner in crates/office-tools/src/tools/tests/insights.rs.
schemaVersion: 1
kind: PluginTest
tests:
  - name: review_inputs_empty_history
    tool: review-inputs
    input: {"since": "2026-10-05", "until": "2026-10-12"}
    expect:
      output: {"since": "2026-10-05", "until": "2026-10-12", "metrics": {"since": "2026-10-05", "until": "2026-10-12", "totals": {"automation": {"automated_count": 0, "manual_count": 0, "total_count": 0, "automated_minutes": 0, "manual_minutes": 0, "total_minutes": 0, "count_ratio": null, "minutes_ratio": null}, "conversions": [], "hours_returned": 0.0, "first_pass_acceptance": {"numerator": 0, "denominator": 0, "ratio": null}, "knowledge_coverage": {"numerator": 0, "denominator": 0, "ratio": null}, "proposal_acceptance": {"accepted": 0, "dismissed": 0, "ratio": null}, "open_load": []}, "weeks": [{"since": "2026-10-05", "until": "2026-10-12", "metrics": {"automation": {"automated_count": 0, "manual_count": 0, "total_count": 0, "automated_minutes": 0, "manual_minutes": 0, "total_minutes": 0, "count_ratio": null, "minutes_ratio": null}, "conversions": [], "hours_returned": 0.0, "first_pass_acceptance": {"numerator": 0, "denominator": 0, "ratio": null}, "knowledge_coverage": {"numerator": 0, "denominator": 0, "ratio": null}, "proposal_acceptance": {"accepted": 0, "dismissed": 0, "ratio": null}, "open_load": []}}]}, "completed_tasks": [], "accepted_proposals": [], "outputs": [], "conversation_sources": [], "daily_digests": [], "knowledge_changes": []}
  - name: review_inputs_refuses_unknown_input
    tool: review-inputs
    input: {"since":"2026-10-05","until":"2026-10-12","invent":true}
    expect:
      error: {"code":"invalid_argument"}
