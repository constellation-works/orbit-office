schemaVersion: 1
kind: PluginTest
tests:
  # Runs on the Library that 00-init.yaml scaffolds earlier in path order,
  # so every case here sees an initialized Library.
  - name: config_set_updates_retention
    tool: config-set
    input: {key: retention.meeting, value: 30}
    expect:
      output: {path: .office/config.yaml, key: retention.meeting}
  - name: config_set_refuses_unknown_key
    tool: config-set
    input: {key: retention.typo, value: 30}
    expect:
      error: {code: unknown_library_setting}
  - name: config_set_refuses_invalid_value
    tool: config-set
    input: {key: retention.meeting, value: 0}
    expect:
      error: {code: invalid_library_setting}
  - name: config_set_refuses_secret_setting
    tool: config-set
    input: {key: meta_api_key, value: fixture-only}
    expect:
      error: {code: unknown_library_setting}
  - name: config_set_refuses_unknown_input
    tool: config-set
    input: {key: retention.meeting, value: 30, verbose: true}
    expect:
      error: {code: invalid_argument}
  - name: calendar_window_days_past_1
    tool: config-set
    input: {"key": "calendar.window_days_past", "value": 1}
    expect:
      output: {"path": ".office/config.yaml", "key": "calendar.window_days_past"}
  - name: calendar_window_days_ahead_90
    tool: config-set
    input: {"key": "calendar.window_days_ahead", "value": 90}
    expect:
      output: {"path": ".office/config.yaml", "key": "calendar.window_days_ahead"}
  - name: calendar_prep_lead_minutes_15
    tool: config-set
    input: {"key": "calendar.prep_lead_minutes", "value": 15}
    expect:
      output: {"path": ".office/config.yaml", "key": "calendar.prep_lead_minutes"}
  - name: calendar_prep_max_per_run_20
    tool: config-set
    input: {"key": "calendar.prep_max_per_run", "value": 20}
    expect:
      output: {"path": ".office/config.yaml", "key": "calendar.prep_max_per_run"}
  - name: calendar_connection_demo_calendar
    tool: config-set
    input: {"key": "calendar.connection", "value": "demo-calendar"}
    expect:
      output: {"path": ".office/config.yaml", "key": "calendar.connection"}
  - name: calendar_connection_None
    tool: config-set
    input: {"key": "calendar.connection", "value": null}
    expect:
      output: {"path": ".office/config.yaml", "key": "calendar.connection"}
  - name: calendar_window_days_past_0
    tool: config-set
    input: {"key": "calendar.window_days_past", "value": 0}
    expect:
      error: {code: invalid_library_setting}
  - name: calendar_window_days_ahead_91
    tool: config-set
    input: {"key": "calendar.window_days_ahead", "value": 91}
    expect:
      error: {code: invalid_library_setting}
  - name: calendar_prep_lead_minutes_14
    tool: config-set
    input: {"key": "calendar.prep_lead_minutes", "value": 14}
    expect:
      error: {code: invalid_library_setting}
  - name: calendar_prep_max_per_run_21
    tool: config-set
    input: {"key": "calendar.prep_max_per_run", "value": 21}
    expect:
      error: {code: invalid_library_setting}
  - name: calendar_typo_1
    tool: config-set
    input: {"key": "calendar.typo", "value": 1}
    expect:
      error: {code: unknown_library_setting}
  - name: shared_config_stores_the_closed_block
    tool: config-set
    input: {"key":"shared","value":{"remote":"git@example.invalid:team/library.git","branch":"main","member":"fixture-member"}}
    expect:
      output: {"path":".office/config.yaml","key":"shared"}
  - name: shared_config_refuses_remote_credentials
    tool: config-set
    input: {"key":"shared.remote","value":"https://fixture-secret@example.invalid/team.git"}
    expect:
      error: {"code":"invalid_library_setting"}
  - name: shared_config_refuses_an_unsupported_remote
    tool: config-set
    input: {"key":"shared.remote","value":"ftp://example.invalid/team.git"}
    expect:
      error: {"code":"invalid_library_setting"}
  - name: shared_config_refuses_an_invalid_member
    tool: config-set
    input: {"key":"shared.member","value":"Fixture_Member"}
    expect:
      error: {"code":"invalid_library_setting"}
  - name: shared_config_clears_the_block
    tool: config-set
    input: {"key":"shared","value":null}
    expect:
      output: {"path":".office/config.yaml","key":"shared"}
