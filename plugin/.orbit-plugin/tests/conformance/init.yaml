schemaVersion: 1
kind: PluginTest
tests:
  # config-set.yaml sorts first and scaffolds the shared workspace.
  - name: init_is_idempotent_after_config_set
    tool: init
    input: {}
    expect:
      output:
        already_initialized: true
        created: []
  - name: init_refuses_a_library_dir_outside_the_library
    tool: init
    input: {"library_dir": "../outside"}
    expect:
      error:
        code: library_dir_outside_workspace
  - name: init_refuses_unknown_input
    tool: init
    input: {"verbose": true}
    expect:
      error:
        code: invalid_argument
