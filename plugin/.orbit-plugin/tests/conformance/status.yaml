schemaVersion: 1
kind: PluginTest
tests:
  # `orbit plugin test` never opens the secret store, so every declared
  # secret reads as unset here. The knowledge goldens wrote two domain
  # pages and one runbook, each meeting its template.
  - name: status_with_no_secrets_set
    tool: status
    input: {}
    expect:
      output:
        version: 0.1.0
        secrets:
          meta_api_key: unset
          open_weights_token: unset
          baseten_token: unset
        open_weights_token_binding: unset
        hosted_key_binding: unset
        hosted_key_bound_origin: null
        library:
          initialized: true
          documents: 3
          documents_by_kind:
            source: 0
            domain: 2
            runbook: 1
            artifact: 0
          pages_off_template: 0
          template_invalid: []
        hosted:
          endpoint: https://api.meta.ai/v1
          standard: muse-spark-1.3
          careful: muse-wonder
          transcribe: muse-voice-transcribe-1.0
        open_weights: null
        shared: null
        brief: {task_workspaces: []}
  - name: status_refuses_unknown_input
    tool: status
    input: {"verbose": true}
    expect:
      error:
        code: invalid_argument
