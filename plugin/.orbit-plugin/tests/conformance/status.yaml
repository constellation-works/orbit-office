schemaVersion: 1
kind: PluginTest
tests:
  # `orbit plugin test` never opens the secret store, so every declared
  # secret reads as unset here.
  - name: status_with_no_secrets_set
    tool: status
    input: {}
    expect:
      output:
        version: 0.1.0
        secrets:
          meta_api_key: unset
          baseten_token: unset
        library:
          initialized: true
          documents: 0
          documents_by_kind:
            source: 0
            domain: 0
            runbook: 0
            artifact: 0
          pages_off_template: 0
          template_invalid: []
  - name: status_refuses_unknown_input
    tool: status
    input: {"verbose": true}
    expect:
      error:
        code: invalid_argument
