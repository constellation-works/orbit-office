schemaVersion: 1
kind: PluginTest
tests:
  # Sorts first on purpose: `orbit plugin test` runs goldens in path order
  # over one shared workspace, and every Library tool refuses until init has
  # scaffolded it. The scaffold golden must be the first case that runs.
  - name: init_scaffolds_the_library
    tool: init
    input: {}
    expect:
      output:
        already_initialized: false
        created: [".git", ".gitignore", ".office", ".office/config.yaml", ".office/templates", ".office/templates/client.md", ".office/templates/glossary.md", ".office/templates/goals.md", ".office/templates/person.md", ".office/templates/project.md", ".office/templates/rhythm.md", ".office/templates/runbook.md", ".office/templates/standing-directions.md", ".office/templates/systems.md", ".office/templates/topic.md", ".office/templates/user.md", "artifacts", "artifacts/.gitkeep", "index.sqlite", "knowledge/domain", "knowledge/domain/.gitkeep", "knowledge/runbooks", "knowledge/runbooks/.gitkeep", "proposals", "proposals/.gitkeep", "sources", "sources/.gitkeep"]
  - name: init_is_idempotent_after_scaffold
    tool: init
    input: {}
    expect:
      output:
        already_initialized: true
        created: []
  - name: init_refuses_a_library_dir_outside_the_library
    tool: init
    input: {"library_dir": "../outside"}
    expect:
      error:
        code: library_dir_outside_workspace
  - name: init_refuses_unknown_input
    tool: init
    input: {"verbose": true}
    expect:
      error:
        code: invalid_argument
