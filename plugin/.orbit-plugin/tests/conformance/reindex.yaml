schemaVersion: 1
kind: PluginTest
tests:
  # Runs after init.yaml in the shared conformance workspace, on the
  # Library `office.init` just scaffolded (still empty, so zero indexed).
  - name: reindex_rebuilds_the_index
    tool: reindex
    input: {}
    expect:
      output:
        indexed_documents: 0
  - name: reindex_refuses_unknown_input
    tool: reindex
    input: {"verbose": true}
    expect:
      error:
        code: invalid_argument
