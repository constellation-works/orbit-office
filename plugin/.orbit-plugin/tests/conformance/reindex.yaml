schemaVersion: 1
kind: PluginTest
tests:
  # Runs after init.yaml and the knowledge goldens in the shared
  # conformance workspace: the three pages they wrote are indexed.
  - name: reindex_rebuilds_the_index
    tool: reindex
    input: {}
    expect:
      output:
        indexed_documents: 3
  - name: reindex_refuses_unknown_input
    tool: reindex
    input: {"verbose": true}
    expect:
      error:
        code: invalid_argument
