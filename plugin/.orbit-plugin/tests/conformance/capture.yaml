schemaVersion: 1
kind: PluginTest
tests:
  # Runs after 00-init.yaml has scaffolded the shared conformance Library. The
  # pasted-text capture is not pinned here: its output carries a source id and
  # path minted from the runtime clock date, and a golden must match the whole
  # output exactly. crates/office/tests/library.rs covers capture through the
  # binary.
  - name: capture_refuses_unknown_input
    tool: capture
    input: {"text": "x", "verbose": true}
    expect:
      error:
        code: invalid_argument
  - name: capture_refuses_an_invalid_conversation_entry_kind
    tool: capture
    input: {"append_to": "src-00000000-missing", "entries": [{"kind": "bogus", "text": "Nope."}]}
    expect:
      error:
        code: invalid_conversation_entry_kind
