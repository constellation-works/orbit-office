schemaVersion: 1
kind: PluginTest
tests:
  # Runs on the shared conformance Library (scaffolded by config-set.yaml's
  # init case in path order after this file only when the harness has
  # initialized it; the success case is a pasted-text capture).
  - name: capture_pasted_text_returns_a_source_id
    tool: capture
    input: {"kind": "note", "title": "Conformance note", "text": "Conformance pasted text."}
    expect:
      output:
        kind: note
        title: Conformance note
        deduplicated: false
  - name: capture_refuses_unknown_input
    tool: capture
    input: {"text": "x", "verbose": true}
    expect:
      error:
        code: invalid_argument
  - name: capture_refuses_an_invalid_conversation_entry_kind
    tool: capture
    input: {"append_to": "src-00000000-missing", "entries": [{"kind": "bogus", "text": "Nope."}]}
    expect:
      error:
        code: invalid_conversation_entry_kind
