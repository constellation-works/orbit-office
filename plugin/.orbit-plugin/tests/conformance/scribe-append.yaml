schemaVersion: 1
kind: PluginTest
tests:
  - name: scribe_append_requires_a_parsed_session
    tool: scribe-append
    input: {"session_id":"session-one","through":"m-0001","entries":[]}
    expect:
      error: {"code":"scribe_not_parsed"}
  - name: scribe_append_refuses_a_malformed_entry
    tool: scribe-append
    input: {"session_id":"session-one","through":"m-0001","entries":[{"msg":"m-0001","tag":"fact"}]}
    expect:
      error: {"code":"invalid_argument"}
