schemaVersion: 1
kind: PluginTest
tests:
  - name: scribe_query_refuses_an_unknown_mode
    tool: scribe-query
    input: {"mode":"bogus"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_query_refuses_a_bad_date
    tool: scribe-query
    input: {"since":"2026-13-01"}
    expect:
      error: {"code":"invalid_argument"}
