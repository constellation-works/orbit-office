schemaVersion: 1
kind: PluginTest
tests:
  - name: scribe_control_get_unknown_session_reads_default
    tool: scribe-control
    input: {"op":"get","session_id":"session-one"}
    expect:
      output: {"op":"get","session_id":"session-one","on":null,"now_requested":false,"now_requested_at":null,"title":null,"heartbeat_at":null,"window_open":false,"updated_at":null}
  - name: scribe_control_set_switch_requires_on
    tool: scribe-control
    input: {"op":"set_switch","session_id":"session-one"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_refuses_field_for_other_op
    tool: scribe-control
    input: {"op":"get","session_id":"session-one","title":"not for get"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_refuses_unsafe_session_id
    tool: scribe-control
    input: {"op":"get","session_id":"../other"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_unknown_op
    tool: scribe-control
    input: {"op":"delete","session_id":"session-one"}
    expect:
      error: {"code":"invalid_argument"}
