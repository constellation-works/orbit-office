schemaVersion: 1
kind: PluginTest
tests:
  - name: scribe_control_get_unknown_session_reads_default
    tool: scribe-control
    input: {"op":"get","session_id":"session-one"}
    expect:
      output: {"op":"get","session_id":"session-one","on":null,"on_by":null,"scope":null,"now_requested":false,"now_requested_at":null,"title":null,"heartbeat_at":null,"window_open":false,"updated_at":null}
  - name: scribe_control_set_switch_requires_on
    tool: scribe-control
    input: {"op":"set_switch","session_id":"session-one"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_refuses_field_for_other_op
    tool: scribe-control
    input: {"op":"get","session_id":"session-one","title":"not for get"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_refuses_unsafe_session_id
    tool: scribe-control
    input: {"op":"get","session_id":"../other"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_unknown_op
    tool: scribe-control
    input: {"op":"delete","session_id":"session-one"}
    expect:
      error: {"code":"invalid_argument"}
  - name: scribe_control_turn_on_records_on_by_and_scope
    tool: scribe-control
    input: {"op":"set_switch","session_id":"session-one","on":true,"on_by":"agent","scope":"global"}
    expect:
      output: {"op":"set_switch","session_id":"session-one","on":true,"on_by":"agent","scope":"global","now_requested":false,"now_requested_at":null,"title":null,"heartbeat_at":null,"window_open":false,"updated_at":"2026-11-01T00:00:00+00:00"}
  - name: scribe_control_refuses_unknown_on_by
    tool: scribe-control
    input: {"op":"set_switch","session_id":"session-one","on":true,"on_by":"scribe"}
    expect:
      error: {"code":"invalid_argument"}
