schemaVersion: 1
kind: PluginTest
tests:
  # Success is covered by crates/office/tests/library.rs
  # (capture_and_source_show_through_the_binary), which passes the id that
  # capture returns. Capture mints src-<UTC date>-<slug> from the runtime
  # clock, and orbit plugin test has no seed step or output binding, so this
  # golden pins only the refusals.
  - name: source_show_refuses_an_unknown_source
    tool: source-show
    input: {"id": "src-00000000-missing"}
    expect:
      error:
        code: source_not_found
  - name: source_show_refuses_unknown_input
    tool: source-show
    input: {"id": "src-00000000-missing", "verbose": true}
    expect:
      error:
        code: invalid_argument
  - name: source_show_refuses_non_boolean_history
    tool: source-show
    input: {"id":"src-00000000-missing","history":"true"}
    expect:
      error: {"code":"invalid_argument"}
