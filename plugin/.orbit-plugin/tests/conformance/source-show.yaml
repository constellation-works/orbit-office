schemaVersion: 1
kind: PluginTest
tests:
  # Fixture successes replay through public dispatch in office-tools show tests.
  - name: source_show_fixture_metadata
    tool: source-show
    input: {"id":"src-19700101-source-view"}
    expect:
      output: {"id":"src-19700101-source-view","kind":"video","title":"Fixture","path":"sources/1970/01/src-19700101-source-view/source.md","body":"Transcript.","text":"Transcript.","span":null,"anchor":null,"sensitivity":"normal","sha256":"0cab1c9617404faf2b24e221e189ca5945813e14d3f766345b09ca13bbe28ffc","bytes":5,"media_type":"video/mp4","version":1,"derived_by":{"transcription":"vtt-import","extraction":{"route":"hosted","model":"fixture"}},"cited_by":[{"id":"art-output","title":"Output","kind":"artifact"},{"id":"dom-page","title":"Page","kind":"domain"}],"task_citers_available":false,"cited_by_truncated":false,"chapters":[{"number":1,"title":"Start","label":"core","start":0,"anchor":"#t=00:00:00"},{"number":2,"title":"Aside","label":"tangent","start":65,"anchor":"#t=00:01:05"}]}
  - name: source_show_fixture_original
    tool: source-show
    input: {"id":"src-19700101-source-view","media":"original"}
    expect:
      output: {"id":"src-19700101-source-view","kind":"video","title":"Fixture","path":"sources/1970/01/src-19700101-source-view/source.md","body":"Transcript.","text":"Transcript.","span":null,"anchor":null,"sensitivity":"normal","sha256":"0cab1c9617404faf2b24e221e189ca5945813e14d3f766345b09ca13bbe28ffc","bytes":5,"media_type":"video/mp4","version":1,"derived_by":{"transcription":"vtt-import","extraction":{"route":"hosted","model":"fixture"}},"cited_by":[{"id":"art-output","title":"Output","kind":"artifact"},{"id":"dom-page","title":"Page","kind":"domain"}],"task_citers_available":false,"cited_by_truncated":false,"chapters":[{"number":1,"title":"Start","label":"core","start":0,"anchor":"#t=00:00:00"},{"number":2,"title":"Aside","label":"tangent","start":65,"anchor":"#t=00:01:05"}],"media":{"name":"original.mp4","media_type":"video/mp4","bytes":5,"content_base64":"dmlkZW8=","limit_bytes":524288,"too_large":false,"truncated":false}}
  - name: source_show_refuses_unknown_source
    tool: source-show
    input: {"id":"src-00000000-missing"}
    expect:
      error: {"code":"source_not_found"}
  - name: source_show_refuses_unknown_input
    tool: source-show
    input: {"id":"src-19700101-source-view","verbose":true}
    expect:
      error: {"code":"invalid_argument"}
  - name: source_show_refuses_non_boolean_history
    tool: source-show
    input: {"id":"src-19700101-source-view","history":"true"}
    expect:
      error: {"code":"invalid_argument"}
  - name: source_show_refuses_unsafe_frame
    tool: source-show
    input: {"id":"src-19700101-source-view","media":"frame","frame":"../original.mp4"}
    expect:
      error: {"code":"invalid_argument"}
