schemaVersion: 2
kind: Job
metadata:
  name: office-shared-sync
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  steps:
    - id: sync
      timeout_seconds: 360
      spec:
        type: deterministic
        action: plugin.tool_call
        config:
          tool: office.library-sync
          input: {}
