schemaVersion: 2
kind: Job
metadata:
  name: office-meeting-inbox
spec:
  state: enabled
  kind: workflow
  max_active_runs: 1
  steps:
    - id: summarize
      timeout_seconds: 3600
      spec:
        type: deterministic
        action: plugin.tool_call
        config:
          tool: office.extract
          input:
            profile: meeting
