schemaVersion: 2
kind: Plugin
metadata:
  name: office
  version: 0.1.0
  description: >-
    Local-first office work on Orbit: capture sources (meetings, pasted chats,
    documents), maintain a cited Library of knowledge and approved artifacts,
    propose routines from evidence, and measure how much work agents carry.
  homepage: https://github.com/constellation-works/orbit-office
spec:
  requires:
    orbit: ">=0.39.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    programs: [git, ffmpeg, ffprobe, pdftotext, ssh, gh]

  # Built from source at install time (git+ pinned sources only); a local
  # directory install uses the prebuilt output from `make export` instead.
  build:
    programs: [cargo]
    fetch: [cargo, fetch, --locked, --manifest-path, Cargo.toml]
    command: [cargo, build, --release, --offline, --locked, --manifest-path, Cargo.toml, -p, office, --target-dir, "{{build_dir}}/target"]
    outputs:
      - from: target/release/office
        to: bin/office-bin
    timeout_ms: 1200000

  backend:
    type: exec
    command: bin/office
    args: [orbit-tool]
    timeout_ms: 60000
    sandbox: default

  permissions:
    fs:
      read: ["{{workspace}}", "{{plugin_state}}"]
      write: ["{{workspace}}/library", "{{plugin_state}}"]
    # The configured hosted endpoint (models.endpoint, api.meta.ai by
    # default) and the open-weights endpoint only (enforced in code).
    network: any
    orbit_tools:
      - orbit.task.add
      - orbit.task.update
      - orbit.task.list
      - orbit.task.show
      - orbit.task.artifact.get
      - orbit.task.artifact.put
      - orbit.friction.add
      - orbit.search
      - orbit.auto_task.add
      - orbit.auto_task.update
      - orbit.auto_task.list
      - orbit.decision.list
      - orbit.decision.show
      - gateway.connection-list
      - gateway.http-get

  secrets:
    - name: meta_api_key
      description: API key for the hosted model endpoint (models.endpoint; Meta's Model API by default).
      rotatable: true
    - name: open_weights_token
      description: Token for the private route's open-weights endpoint (the one you chose for `private` sources), when it needs one.
      rotatable: true

  tools:
    - name: status
      description: >-
        Report the plugin version and which declared secrets are set (names
        only; never a value). Library and index health join this output with
        the `reindex` slice. Writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/status.request.json }
      output_schema: { $ref: schemas/status.response.json }

    # Planned tools, one reserved block each, in registry order. A planned
    # tool is not advertised (STD-01 R36). The task that builds one
    # uncomments its block in place and edits nothing else here
    # (ARCHITECTURE.md, "Tools"); keep the blank line between blocks.

    - name: calendar-sync
      description: Read an ICS file or gateway calendar, or manage workspace-local events and source selection.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/calendar-sync.request.json }
      output_schema: { $ref: schemas/calendar-sync.response.json }

    - name: calendar-list
      description: Events overlapping a range of at most 42 days, with matched people and no attendee emails.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/calendar-list.request.json }
      output_schema: { $ref: schemas/calendar-list.response.json }

    - name: meeting-prep
      description: Write cited Library briefs for upcoming meetings, once per event key.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/meeting-prep.request.json }
      output_schema: { $ref: schemas/meeting-prep.response.json }

    # ---- sources ----

    - name: capture
      description: >-
        Create a source from an upload path or pasted text; convert documents
        to anchorable text, store tags and dedupe; return the id. A staged session
        transcript plus session_id previews scrubbed evidence or updates one
        versioned conversation source, preserving handoffs and exact user words.
      execution_kind: mutating
      agent_callable: true
      mcp_scope: workspace
      input_schema: { $ref: schemas/capture.request.json }
      output_schema: { $ref: schemas/capture.response.json }

    - name: transcribe
      description: >-
        Transcribe a meeting source's original into its body (the
        configured transcription model, Muse Voice Transcribe by default).
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/transcribe.request.json }
      output_schema: { $ref: schemas/transcribe.response.json }

    - name: video-plan
      description: >-
        Plan a video source's processing: duration, deduplicated
        keyframes, model-call counts and a cost estimate; confirm it with
        the digest the user saw. With no input, list confirmed plans whose
        extraction has not run, for routine fan-out.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/video-plan.request.json }
      output_schema: { $ref: schemas/video-plan.response.json }

    - name: frames
      description: >-
        Extract a confirmed video's planned keyframes and read each with
        the standard model's image input; run only by the KT routine.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/frames.request.json }
      output_schema: { $ref: schemas/frames.response.json }

    - name: extract
      description: >-
        From a source, produce structured JSON plus a task artifact:
        for a KT video the chapters, knowledge candidates and questions;
        for a meeting the summary, decisions and to-dos, with the decisions
        appended to the decision ledger and each contradiction filed as a
        Needs-you to-do.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/extract.request.json }
      output_schema: { $ref: schemas/extract.response.json }

    - name: source-show
      description: >-
        Return a source with provenance, citers and chapters, optionally at an
        anchor, with bounded document history or bounded original/frame media.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/source-show.request.json }
      output_schema: { $ref: schemas/source-show.response.json }

    - name: source-set-sensitivity
      description: >-
        Set source sensitivity. Private sources cannot be downgraded to normal.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/source-set-sensitivity.request.json }
      output_schema: { $ref: schemas/source-set-sensitivity.response.json }

    # ---- sharing ----

    - name: share-set
      description: Set or clear explicit sharing approval on a Library document; private documents and unshared own citations are refused.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/share-set.request.json }
      output_schema: { $ref: schemas/share-set.response.json }

    - name: library-sync
      description: Pull the team's shared library into the read-only shared layer, file incoming updates and conflicts as proposals, then push the shareable documents' shared view; dry_run changes nothing.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/library-sync.request.json }
      output_schema: { $ref: schemas/library-sync.response.json }

    # ---- knowledge ----

    - name: knowledge-list
      description: >-
        List page summaries and unfilled bundled singleton templates,
        optionally filtered by template.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/knowledge-list.request.json }
      output_schema: { $ref: schemas/knowledge-list.response.json }

    - name: knowledge-show
      description: >-
        Read a page and its back-links, optionally with bounded document history.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/knowledge-show.request.json }
      output_schema: { $ref: schemas/knowledge-show.response.json }

    - name: knowledge-write
      description: >-
        Create or update a page; validate frontmatter and cites; commit.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/knowledge-write.request.json }
      output_schema: { $ref: schemas/knowledge-write.response.json }

    # ---- artifacts ----

    - name: artifact-list
      description: >-
        List artifact summaries (id, kind, series, title, approved date,
        sensitivity), newest first, optionally filtered by kind and
        series, bounded by limit with total and truncated.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/artifact-list.request.json }
      output_schema: { $ref: schemas/artifact-list.response.json }

    - name: artifact-show
      description: >-
        Read an artifact, its files, its series history and what cites
        it, optionally with bounded document history.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/artifact-show.request.json }
      output_schema: { $ref: schemas/artifact-show.response.json }

    - name: artifact-promote
      description: >-
        Copy an approved task's output into the Library as an artifact;
        write provenance; commit.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/artifact-promote.request.json }
      output_schema: { $ref: schemas/artifact-promote.response.json }

    # ---- library ----

    - name: init
      description: >-
        Scaffold the Library: layout, git repository, config,
        .gitignore, index; idempotent.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/init.request.json }
      output_schema: { $ref: schemas/init.response.json }

    - name: reindex
      description: >-
        Rebuild the SQLite index from the Library.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/reindex.request.json }
      output_schema: { $ref: schemas/reindex.response.json }

    - name: config-set
      description: >-
        Validate and write one Library setting in .office/config.yaml;
        commit.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/config-set.request.json }
      output_schema: { $ref: schemas/config-set.response.json }

    - name: private-route-check
      description: >-
        Check the configured open-weights endpoint with a tiny text, image
        and audio request; record the capabilities it accepts.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/private-route-check.request.json }
      output_schema: { $ref: schemas/private-route-check.response.json }

    - name: search
      description: >-
        FTS over sources, knowledge and artifacts, with filters by kind,
        template, tag, series and date. An empty query is refused.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/search.request.json }
      output_schema: { $ref: schemas/search.response.json }

    - name: attach
      description: >-
        Pick the knowledge, source and example artifact files for a task
        (at most 8, by template attach policy first) and copy them into it
        as task artifacts under context/, pages as their model views, with
        the Library commit they were read at.
      execution_kind: mutating
      agent_callable: true
      mcp_scope: workspace
      input_schema: { $ref: schemas/attach.request.json }
      output_schema: { $ref: schemas/attach.response.json }

    # ---- proposals ----

    - name: signals-scan
      description: >-
        Run the proposal signals and return candidate proposals with
        evidence.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/signals-scan.request.json }
      output_schema: { $ref: schemas/signals-scan.response.json }

    - name: proposal-create
      description: >-
        File a proposal task, its artifact and its evidence page.
      execution_kind: mutating
      agent_callable: true
      mcp_scope: workspace
      input_schema: { $ref: schemas/proposal-create.request.json }
      output_schema: { $ref: schemas/proposal-create.response.json }

    - name: proposal-accept
      description: >-
        Apply a proposal's payload; close the task.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/proposal-accept.request.json }
      output_schema: { $ref: schemas/proposal-accept.response.json }

    - name: proposal-reconcile
      description: >-
        Move each proposal's evidence page to the status folder its task
        says (open, accepted or dismissed); legacy flat pages migrate.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/proposal-reconcile.request.json }
      output_schema: { $ref: schemas/proposal-reconcile.response.json }

    # ---- selection ----

    - name: selection-get
      description: >-
        Return the user's fresh, unused selections from the app and mark
        them consumed.
      execution_kind: mutating
      agent_callable: true
      mcp_scope: workspace
      input_schema: { $ref: schemas/selection-get.request.json }
      output_schema: { $ref: schemas/selection-get.response.json }

    - name: selection-put
      description: >-
        Record a selection from the app; clear: true empties the tray.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/selection-put.request.json }
      output_schema: { $ref: schemas/selection-put.response.json }

    # ---- sessions ----

    - name: session-brief
      description: >-
        Assemble the session-start brief from Orbit and the Library:
        waiting on you, agents working on, open questions, the last
        session's decisions. Makes no model call. Writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/session-brief.request.json }
      output_schema: { $ref: schemas/session-brief.response.json }

    - name: digest
      description: >-
        Write the day's digest artifact with one model call (the
        office-daily-digest routine), or, with `source`, return the cited
        digest since that meeting: Decided, Shipped with PR and merge links,
        and Needs you. The source digest makes no model call and writes
        nothing.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/digest.request.json }
      output_schema: { $ref: schemas/digest.response.json }

    - name: source-digest
      description: >-
        The cited digest since a meeting source, read-only: Decided,
        Shipped with PR and merge links, and Needs you. The same output as
        digest with `source`; no model call, no writes. The app reads it.
      execution_kind: read_only
      mcp_scope: none
      input_schema: { $ref: schemas/source-digest.request.json }
      output_schema: { $ref: schemas/source-digest.response.json }

    - name: scribe-control
      description: >-
        Own per-session scribe control state: get the switch, set it,
        request Capture now (and consume it), set the title and record the
        window-open heartbeat. The provider plugin's hooks read this state;
        the flag file is their local cache. Plugin state only.
      execution_kind: mutating
      agent_callable: true
      mcp_scope: workspace
      input_schema: { $ref: schemas/scribe-control.request.json }
      output_schema: { $ref: schemas/scribe-control.response.json }

    - name: scribe-pending
      description: >-
        Parse a session transcript into the scribe's message file and return
        the messages after the session's scribed_through, with its SCR
        metadata and the scribe rules. Model-free.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/scribe-pending.request.json }
      output_schema: { $ref: schemas/scribe-pending.response.json }

    - name: scribe-append
      description: >-
        Validate the scribe's entries against the transcript and append them
        to the session's SCR file, refusing any quote that is not an exact
        substring of its message; commit to the Library. Model-free.
      execution_kind: mutating
      agent_callable: true
      mcp_scope: workspace
      input_schema: { $ref: schemas/scribe-append.request.json }
      output_schema: { $ref: schemas/scribe-append.response.json }

    - name: scribe-query
      description: >-
        Filter the session SCR lines by tag, matter, topic, author, date
        range, refs or session, and resolve the links between lines.
        Model-free.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/scribe-query.request.json }
      output_schema: { $ref: schemas/scribe-query.response.json }

    - name: scribe-ask
      description: >-
        Answer a question with one Standard-tier model call over a
        model-free SCR shortlist, verbatim-checking every quoted span
        against its cited SCR line. Private entries are cited by
        reference only when no open-weights route is configured.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/scribe-ask.request.json }
      output_schema: { $ref: schemas/scribe-ask.response.json }

    - name: scribe-migrate
      description: >-
        Tidy up after scribe v1 once: propose removing the v1 Tags section
        from the scribe rules page (unless already filed) and report open
        v1 pending lines. v1 preferences and decisions are not backfilled.
        Model-free; run by an operator.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/scribe-migrate.request.json }
      output_schema: { $ref: schemas/scribe-migrate.response.json }

    - name: decision-ingest
      description: >-
        Append answered Orbit decision requests in the followed workspaces
        to the decision ledgers, one entry per answer: human and model
        answers, review-gate confirms and vetoes, and re-answers that
        reverse a model answer. Skips precedent-actor, superseded, expired
        and already-ingested requests, links a matching scribe entry with
        same_as and reports ambiguous matches. Model-free; run by the
        office-decision-ingest routine or an operator.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/decision-ingest.request.json }
      output_schema: { $ref: schemas/decision-ingest.response.json }

    - name: decision-precedents
      description: >-
        Return bounded decision ledger evidence under orbit.precedent-provider/1,
        ranked by lexical relevance and recency. Read-only and model-free;
        private, agent and unconfirmed model entries are excluded.
      execution_kind: read_only
      mcp_scope: none
      input_schema: { $ref: schemas/decision-precedents.request.json }
      output_schema: { $ref: schemas/decision-precedents.response.json }

    - name: decision-resolve
      description: >-
        Settle one open decision-conflict to-do in one call: record which
        entry stands as a new decision ledger entry that reverses the other,
        close the to-do, and file the agent to-dos it held when the decision
        they act on stands (rejecting the rest). Model-free and retry-safe.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/decision-resolve.request.json }
      output_schema: { $ref: schemas/decision-resolve.response.json }

    # ---- recall ----

    - name: recall
      description: >-
        Answer where a conversation discussed a topic, what was decided and
        whether it landed, from captured entries; without a question, list
        entries newest first (optionally one session's) for the Scribe feed.
        No model call; private sources give no entry text.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/recall.request.json }
      output_schema: { $ref: schemas/recall.response.json }

    - name: recall-answer
      description: >-
        Answer a recall question with one Standard-tier model call over
        recall evidence, then return the cited answer plus the recall
        payload. Private sources are named by reference only unless an
        open-weights route is configured. The web server calls this tool.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/recall-answer.request.json }
      output_schema: { $ref: schemas/recall-answer.response.json }

    # ---- scripts ----

    - name: script-run
      description: >-
        Run an approved, pinned script artifact offline in its own run
        directory, within its bounds, and file its outputs for review;
        run only by routine and auto-task steps.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/script-run.request.json }
      output_schema: { $ref: schemas/script-run.response.json }

    # ---- bootstrap ----

    - name: batch-plan
      description: >-
        Plan a Library bootstrap phase's batch: model calls and cost;
        confirm it with the digest the user saw. With no input, list
        confirmed batches not yet consolidated, for routine fan-out.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/batch-plan.request.json }
      output_schema: { $ref: schemas/batch-plan.response.json }

    - name: consolidate
      description: >-
        Group a confirmed batch's digests by subject, apply the page
        rules, and file one knowledge proposal per page.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/consolidate.request.json }
      output_schema: { $ref: schemas/consolidate.response.json }

    - name: bootstrap-status
      description: >-
        Report Library setup progress per bootstrap phase, with the
        computed gaps and the confirmed batches not yet consolidated.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/bootstrap-status.request.json }
      output_schema: { $ref: schemas/bootstrap-status.response.json }

    # ---- insights ----

    - name: metrics
      description: >-
        Compute the analytics metrics for a window.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/metrics.request.json }
      output_schema: { $ref: schemas/metrics.response.json }

    - name: review-inputs
      description: >-
        Gather a period's completed work, conversions, metrics,
        decisions and knowledge changes for a review.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/review-inputs.request.json }
      output_schema: { $ref: schemas/review-inputs.response.json }

  definitions:
    auto_tasks: [definitions/auto_tasks/office-review.yaml, definitions/auto_tasks/office-knowledge-maintenance.yaml, definitions/auto_tasks/office-knowledge-verify.yaml, definitions/auto_tasks/office-conversation-extract.yaml, definitions/auto_tasks/office-scribe-contradictions.yaml]
    activities: [definitions/activities/office-agent-todo.yaml]
    jobs: [definitions/jobs/office-meeting-inbox.yaml, definitions/jobs/office-meeting-prep.yaml, definitions/jobs/office-calendar-sync.yaml, definitions/jobs/office-daily-digest.yaml, definitions/jobs/office-signals.yaml, definitions/jobs/office-kt-inbox.yaml, definitions/jobs/office-bootstrap.yaml, definitions/jobs/office-shared-sync.yaml, definitions/jobs/office-decision-ingest.yaml]
    routines: [definitions/routines/office-meeting-inbox.yaml, definitions/routines/office-meeting-prep.yaml, definitions/routines/office-calendar-sync.yaml, definitions/routines/office-daily-digest.yaml, definitions/routines/office-signals.yaml, definitions/routines/office-kt-inbox.yaml, definitions/routines/office-bootstrap.yaml, definitions/routines/office-shared-sync.yaml, definitions/routines/office-decision-ingest.yaml]

  skills: [skills/orchestrator, skills/library-conventions, skills/meetings, skills/kt, skills/bootstrap]

  config:
    schema: schemas/config.json

  web:
    panels:
      - id: status
        title: Office Library
        source: tool:status
        render: kv
        group: operations
        refresh_ms: 60000

  tests: [tests/conformance/*.yaml]
