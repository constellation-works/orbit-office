    #   execution_kind: mutating
    #   mcp_scope: none
    #   input_schema: { $ref: schemas/frames.request.json }
    #   output_schema: { $ref: schemas/frames.response.json }

    # - name: extract
    #   description: >-
    #     From a source, produce structured JSON plus a task artifact:
