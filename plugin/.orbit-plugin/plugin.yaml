schemaVersion: 2
kind: Plugin
metadata:
  name: office
  version: 0.1.0
  description: >-
    Local-first office work on Orbit: capture sources (meetings, pasted chats,
    documents), maintain a cited Library of knowledge and approved artifacts,
    propose routines from evidence, and measure how much work agents carry.
  homepage: https://github.com/constellation-works/orbit-office
spec:
  requires:
    orbit: ">=0.34.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    programs: [git, ffmpeg, ffprobe, pdftotext]

  # Built from source at install time (git+ pinned sources only); a local
  # directory install uses the prebuilt output from `make export` instead.
  build:
    programs: [cargo]
    fetch: [cargo, fetch, --locked, --manifest-path, Cargo.toml]
    command: [cargo, build, --release, --offline, --locked, --manifest-path, Cargo.toml, -p, office, --target-dir, "{{build_dir}}/target"]
    outputs:
      - from: target/release/office
        to: bin/office-bin
    timeout_ms: 1200000

  backend:
    type: exec
    command: bin/office
    args: [orbit-tool]
    timeout_ms: 60000
    sandbox: default

  permissions:
    fs:
      read: ["{{workspace}}", "{{plugin_state}}"]
      write: ["{{workspace}}/library", "{{plugin_state}}"]
    # Meta Model API and the open-weights endpoint only (enforced in code).
    network: any
    orbit_tools:
      - orbit.task.add
      - orbit.task.update
      - orbit.task.list
      - orbit.task.show
      - orbit.task.artifact.get
      - orbit.task.artifact.put
      - orbit.friction.add
      - orbit.search
      - orbit.auto_task.add
      - orbit.auto_task.update
      - orbit.auto_task.list
      - gateway.connection-list
      - gateway.http-get

  secrets:
    - name: meta_api_key
      description: Meta Model API key for Muse Spark and Muse Voice Transcribe.
      rotatable: true
    - name: open_weights_token
      description: Token for the private route's Muse Spark Open endpoint (the one you chose for `private` sources), when it needs one.
      rotatable: true

  tools:
    - name: status
      description: >-
        Report the plugin version and which declared secrets are set (names
        only; never a value). Library and index health join this output with
        the `reindex` slice. Writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/status.request.json }
      output_schema: { $ref: schemas/status.response.json }

    # Planned tools, one reserved block each, in registry order. A planned
    # tool is not advertised (STD-01 R36). The task that builds one
    # uncomments its block in place and edits nothing else here
    # (ARCHITECTURE.md, "Tools"); keep the blank line between blocks.

    - name: calendar-sync
      description: Read an ICS file or gateway calendar and atomically replace the private snapshot.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/calendar-sync.request.json }
      output_schema: { $ref: schemas/calendar-sync.response.json }

    - name: calendar-list
      description: Events overlapping a range of at most 42 days, with matched people and no attendee emails.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/calendar-list.request.json }
      output_schema: { $ref: schemas/calendar-list.response.json }

    - name: meeting-prep
      description: Write cited Library briefs for upcoming meetings, once per event key.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/meeting-prep.request.json }
      output_schema: { $ref: schemas/meeting-prep.response.json }

    # ---- sources ----

    - name: capture
      description: >-
        Create a source from an upload path or pasted text; convert documents
        to anchorable text, store tags and dedupe; return the id.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/capture.request.json }
      output_schema: { $ref: schemas/capture.response.json }

    - name: transcribe
      description: >-
        Transcribe a meeting source's original into its body (Muse Voice
        Transcribe).
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/transcribe.request.json }
      output_schema: { $ref: schemas/transcribe.response.json }

    - name: video-plan
      description: >-
        Plan a video source's processing: duration, deduplicated
        keyframes, model-call counts and a cost estimate; confirm it with
        the digest the user saw. With no input, list confirmed plans whose
        extraction has not run, for routine fan-out.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/video-plan.request.json }
      output_schema: { $ref: schemas/video-plan.response.json }

    - name: frames
      description: >-
        Extract a confirmed video's planned keyframes and read each with
        Muse Spark image input; run only by the KT routine.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/frames.request.json }
      output_schema: { $ref: schemas/frames.response.json }

    - name: extract
      description: >-
        From a source, produce structured JSON plus a task artifact:
        for a KT video the chapters, knowledge candidates and questions;
        for a meeting the summary, decisions and to-dos.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/extract.request.json }
      output_schema: { $ref: schemas/extract.response.json }

    - name: source-show
      description: >-
        Return a source with provenance, citers and chapters, optionally at an
        anchor, with bounded document history or bounded original/frame media.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/source-show.request.json }
      output_schema: { $ref: schemas/source-show.response.json }

    - name: source-set-sensitivity
      description: >-
        Set source sensitivity. Private sources cannot be downgraded to normal.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/source-set-sensitivity.request.json }
      output_schema: { $ref: schemas/source-set-sensitivity.response.json }

    # ---- knowledge ----

    - name: knowledge-list
      description: >-
        List page summaries and unfilled bundled singleton templates,
        optionally filtered by template.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/knowledge-list.request.json }
      output_schema: { $ref: schemas/knowledge-list.response.json }

    - name: knowledge-show
      description: >-
        Read a page and its back-links, optionally with bounded document history.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/knowledge-show.request.json }
      output_schema: { $ref: schemas/knowledge-show.response.json }

    - name: knowledge-write
      description: >-
        Create or update a page; validate frontmatter and cites; commit.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/knowledge-write.request.json }
      output_schema: { $ref: schemas/knowledge-write.response.json }

    # ---- artifacts ----

    - name: artifact-list
      description: >-
        List artifact summaries (id, kind, series, title, approved date,
        sensitivity), newest first, optionally filtered by kind and
        series, bounded by limit with total and truncated.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/artifact-list.request.json }
      output_schema: { $ref: schemas/artifact-list.response.json }

    - name: artifact-show
      description: >-
        Read an artifact, its files, its series history and what cites
        it, optionally with bounded document history.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/artifact-show.request.json }
      output_schema: { $ref: schemas/artifact-show.response.json }

    - name: artifact-promote
      description: >-
        Copy an approved task's output into the Library as an artifact;
        write provenance; commit.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/artifact-promote.request.json }
      output_schema: { $ref: schemas/artifact-promote.response.json }

    # ---- library ----

    - name: init
      description: >-
        Scaffold the Library: layout, git repository, config,
        .gitignore, index; idempotent.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/init.request.json }
      output_schema: { $ref: schemas/init.response.json }

    - name: reindex
      description: >-
        Rebuild the SQLite index from the Library.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/reindex.request.json }
      output_schema: { $ref: schemas/reindex.response.json }

    - name: config-set
      description: >-
        Validate and write one Library setting in .office/config.yaml;
        commit.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/config-set.request.json }
      output_schema: { $ref: schemas/config-set.response.json }

    - name: private-route-check
      description: >-
        Check the configured open-weights endpoint with a tiny text, image
        and audio request; record the capabilities it accepts.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/private-route-check.request.json }
      output_schema: { $ref: schemas/private-route-check.response.json }

    - name: search
      description: >-
        FTS over sources, knowledge and artifacts, with filters by kind,
        template, tag, series and date. An empty query is refused.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/search.request.json }
      output_schema: { $ref: schemas/search.response.json }

    - name: attach
      description: >-
        Pick the knowledge, source and example artifact files for a task
        (at most 8, by template attach policy first) and copy them into it
        as task artifacts under context/, pages as their model views, with
        the Library commit they were read at.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/attach.request.json }
      output_schema: { $ref: schemas/attach.response.json }

    # ---- proposals ----

    - name: signals-scan
      description: >-
        Run the proposal signals and return candidate proposals with
        evidence.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/signals-scan.request.json }
      output_schema: { $ref: schemas/signals-scan.response.json }

    - name: proposal-create
      description: >-
        File a proposal task, its artifact and its evidence page.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/proposal-create.request.json }
      output_schema: { $ref: schemas/proposal-create.response.json }

    - name: proposal-accept
      description: >-
        Apply a proposal's payload; close the task.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/proposal-accept.request.json }
      output_schema: { $ref: schemas/proposal-accept.response.json }

    # ---- selection ----

    - name: selection-get
      description: >-
        Return the user's fresh, unused selections from the app and mark
        them consumed.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/selection-get.request.json }
      output_schema: { $ref: schemas/selection-get.response.json }

    - name: selection-put
      description: >-
        Record a selection from the app; clear: true empties the tray.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/selection-put.request.json }
      output_schema: { $ref: schemas/selection-put.response.json }

    # ---- sessions ----

    - name: session-brief
      description: >-
        Assemble the session-start brief from Orbit and the Library:
        waiting on you, agents working on, open questions, the last
        session's decisions. Makes no model call. Writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/session-brief.request.json }
      output_schema: { $ref: schemas/session-brief.response.json }

    - name: digest
      description: >-
        Write the day's digest artifact with one Muse Spark call; run only
        by the office-daily-digest routine.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/digest.request.json }
      output_schema: { $ref: schemas/digest.response.json }

    # ---- scripts ----

    - name: script-run
      description: >-
        Run an approved, pinned script artifact offline in its own run
        directory, within its bounds, and file its outputs for review;
        run only by routine and auto-task steps.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/script-run.request.json }
      output_schema: { $ref: schemas/script-run.response.json }

    # ---- bootstrap ----

    - name: batch-plan
      description: >-
        Plan a Library bootstrap phase's batch: model calls and cost;
        confirm it with the digest the user saw. With no input, list
        confirmed batches not yet consolidated, for routine fan-out.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/batch-plan.request.json }
      output_schema: { $ref: schemas/batch-plan.response.json }

    - name: consolidate
      description: >-
        Group a confirmed batch's digests by subject, apply the page
        rules, and file one knowledge proposal per page.
      execution_kind: mutating
      mcp_scope: none
      input_schema: { $ref: schemas/consolidate.request.json }
      output_schema: { $ref: schemas/consolidate.response.json }

    - name: bootstrap-status
      description: >-
        Report Library setup progress per bootstrap phase, with the
        computed gaps and the confirmed batches not yet consolidated.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/bootstrap-status.request.json }
      output_schema: { $ref: schemas/bootstrap-status.response.json }

    # ---- insights ----

    - name: metrics
      description: >-
        Compute the analytics metrics for a window.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/metrics.request.json }
      output_schema: { $ref: schemas/metrics.response.json }

    - name: review-inputs
      description: >-
        Gather a period's completed work, conversions, metrics,
        decisions and knowledge changes for a review.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/review-inputs.request.json }
      output_schema: { $ref: schemas/review-inputs.response.json }

  definitions:
    auto_tasks: [definitions/auto_tasks/office-review.yaml, definitions/auto_tasks/office-knowledge-maintenance.yaml]
    activities: [definitions/activities/office-agent-todo.yaml]
    jobs: [definitions/jobs/office-meeting-inbox.yaml, definitions/jobs/office-meeting-prep.yaml, definitions/jobs/office-calendar-sync.yaml, definitions/jobs/office-daily-digest.yaml, definitions/jobs/office-signals.yaml, definitions/jobs/office-kt-inbox.yaml, definitions/jobs/office-bootstrap.yaml]
    routines: [definitions/routines/office-meeting-inbox.yaml, definitions/routines/office-meeting-prep.yaml, definitions/routines/office-calendar-sync.yaml, definitions/routines/office-daily-digest.yaml, definitions/routines/office-signals.yaml, definitions/routines/office-kt-inbox.yaml, definitions/routines/office-bootstrap.yaml]

  skills: [skills/orchestrator, skills/library-conventions, skills/meetings, skills/kt, skills/bootstrap]

  config:
    schema: schemas/config.json

  web:
    panels:
      - id: status
        title: Office Library
        source: tool:status
        render: kv
        group: operations
        refresh_ms: 60000

  tests: [tests/conformance/*.yaml]
