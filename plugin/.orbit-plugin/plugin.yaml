schemaVersion: 2
kind: Plugin
metadata:
  name: office
  version: 0.1.0
  description: >-
    Local-first office work on Orbit: capture sources (meetings, pasted chats,
    documents), maintain a cited Library of knowledge and approved artifacts,
    propose routines from evidence, and measure how much work agents carry.
    Scaffold: only `status` exists until the capture slice lands.
  homepage: https://github.com/constellation-works/orbit-office
spec:
  requires:
    orbit: ">=0.34.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]
    programs: [git, ffmpeg]

  # Built from source at install time (git+ pinned sources only); a local
  # directory install uses the prebuilt output from `make export` instead.
  build:
    programs: [cargo]
    fetch: [cargo, fetch, --locked, --manifest-path, Cargo.toml]
    command: [cargo, build, --release, --offline, --locked, --manifest-path, Cargo.toml, -p, office, --target-dir, "{{build_dir}}/target"]
    outputs:
      - from: target/release/office
        to: bin/office-bin
    timeout_ms: 1200000

  backend:
    type: exec
    command: bin/office
    args: [orbit-tool]
    timeout_ms: 60000
    sandbox: default

  permissions:
    fs:
      read: ["{{workspace}}", "{{plugin_state}}"]
      write: ["{{workspace}}/library", "{{plugin_state}}"]
    # Meta Model API and the open-weights endpoint only (enforced in code).
    network: any
    orbit_tools:
      - orbit.task.add
      - orbit.task.update
      - orbit.task.list
      - orbit.task.show
      - orbit.task.artifact.get
      - orbit.task.artifact.put
      - orbit.friction.add
      - orbit.search

  secrets:
    - name: meta_api_key
      description: Meta Model API key for Muse Spark and Muse Voice Transcribe.
      rotatable: true
    - name: baseten_token
      description: Token for the Muse Spark Open (open-weights) endpoint used for `private` sources.
      rotatable: true

  tools:
    - name: status
      description: >-
        Report the plugin version and which declared secrets are set (names
        only; never a value). Library and index health join this output with
        the `reindex` slice. Writes nothing.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/status.request.json }
      output_schema: { $ref: schemas/status.response.json }

    # Planned tools, one reserved block each, in registry order. A planned
    # tool is not advertised (STD-01 R36). The task that builds one
    # uncomments its block in place and edits nothing else here
    # (ARCHITECTURE.md, "Tools"); keep the blank line between blocks.

    # ---- sources ----

    - name: capture
      description: >-
        Create a source from an upload path or pasted text; dedupe;
        return the id.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/capture.request.json }
      output_schema: { $ref: schemas/capture.response.json }

    # - name: transcribe
