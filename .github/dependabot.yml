# Advisory monitoring and pin updates for the Rust, npm, and CI-action ecosystems
# (STD-05 R23, R24): crates through Cargo.lock, npm through
# app/package-lock.json, and the CI actions pinned by SHA in
# .github/workflows/. Updates target the integration branch.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: agent-main
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    target-branch: agent-main
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /app
    target-branch: agent-main
    schedule: { interval: weekly }
