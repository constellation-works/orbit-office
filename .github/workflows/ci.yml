name: ci
on:
  push: { branches: [main, agent-main] }
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        # Both: path handling and file locking differ between them.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hard wall-clock bound outside the process (STD-03 R22); nextest's
    # per-test timeouts are the inner bound.
    timeout-minutes: 30
    env:
      # In CI a missing docs/standards/ vendor is a failure, not a warning.
      # (GitHub also sets CI=true, which makes a missing gate tool fail.)
      STANDARDS_STRICT: "1"
    # Every input is pinned to an immutable id (STD-05 R23): actions by full
    # commit SHA (the tag in the comment is for humans and Dependabot), the
    # toolchain by version, and each tool by version; install-action checks
    # every download against the SHA-256 recorded in its manifest.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with: { toolchain: "1.96.0", components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with: { tool: "cargo-nextest@0.9.136,cargo-deny@0.19.9" }
      - run: make ci

  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - run: npm --prefix app ci
      - run: npm --prefix app run check
      - run: npm --prefix app test
      - run: python3 -I scripts/check-app-boundaries.py

  # The gateway plugins (gateway/): Python 3.12, standard library only.
  # ubuntu-24.04 ships Python 3.12 as python3, the version the plugins
  # require, so no interpreter download is needed.
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 --version
      - run: make -C gateway check test

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          # The fixture's agent-status reader imports TypeScript directly.
          node-version: "24"
      - run: sh scripts/install/test-install.sh
