[workspace]
resolver = "3"
# Seven crates, and why: ARCHITECTURE.md and docs/design/office/4_decisions.md
# ("A crate per enforceable edge, a folder per tool, and every shared list
# written once", "office-store is its own crate", "office-common is the
# foundation crate").
# A new member needs a policy entry in scripts/check-dependency-direction.sh
# and a row in ARCHITECTURE.md.
members = [
    "crates/office-common",
    "crates/office-core",
    "crates/office-store",
    "crates/office-models",
    "crates/office-orbit",
    "crates/office-tools",
    "crates/office-testkit",
    "crates/office",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/constellation-works/orbit-office"

[workspace.dependencies]
office-common = { path = "crates/office-common" }
office-core = { path = "crates/office-core" }
office-store = { path = "crates/office-store" }
office-models = { path = "crates/office-models" }
office-orbit = { path = "crates/office-orbit" }
office-tools = { path = "crates/office-tools" }
office-testkit = { path = "crates/office-testkit" }
# No `color` or `wrap_help`: both make clap query the terminal itself, and the
# output sink is the only place allowed to do that (STD-01 R17). Help is plain
# text everywhere, which also keeps the help goldens byte-stable.
base64 = "0.22"
html5ever = "0.38"
quick-xml = "0.41.0"
# Stored and deflated Office parts only; no encryption or other codecs.
# `deflate-flate2-zlib-rs` reads and writes deflate through flate2 and zlib-rs.
# The umbrella `deflate` feature also enables `deflate-zopfli`, which pulls
# lockfree-object-pool (BSL-1.0) and is not used for these reads.
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# Schema validation must not retrieve URLs or files outside the model routing boundary.
jsonschema = { version = "0.60.2", default-features = false }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tracing = "0.1"
# Blocking HTTP client for office-models only (ARCHITECTURE.md crate policies).
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }

[profile.release]
strip = true

# STD-02 lint baseline, verbatim from the standard. Do not trim it; add to it.
# Workspace-wide lint config. Each crate opts in via `[lints] workspace = true`.
# Keep this list short — only rules that are mechanically true everywhere.
[workspace.lints.clippy]
await_holding_lock = "deny"
dbg_macro = "deny"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
unwrap_used = "warn"

# Adoptable additions beyond the baseline (STD-02 "Adoptable additions").
# STD-02 R27: no wildcard arm on an enum match; a foreign enum that needs one
# gets a scoped #[allow] with its reason.
wildcard_enum_match_arm = "warn"
match_wildcard_for_single_variants = "warn"
# STD-02 R28: narrowing `as` casts must be checked conversions.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"

[workspace.lints.rust]
missing_docs = "warn"
