# Example Library settings. office.init writes the real file at
# library/.office/config.yaml; the app changes it through office.config-set.
# Orbit's [plugins.office] config holds only library_dir.
retention:
  meeting_original_days: 90
sensitivity_defaults:
  email: private
  meeting: normal
  chat: normal
  receipt: private
enabled_packs:
  - meetings
signal_thresholds:
  repetition_min_tasks: 3
  repetition_window_days: 30
# The private route: Muse Spark Open on the one endpoint you chose. Null
# refuses private material rather than sending it to the hosted API.
# capabilities and verified_at are written by office.private-route-check.
open_weights: null
# open_weights:
#   endpoint: https://muse.internal.acme.example/v1
#   model: meta-models/Muse-Spark-Open-816B-A42B
#   kind: company            # company | provider | own_hardware
