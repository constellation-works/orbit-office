# cargo-deny policy (STD-02 R23, STD-05 R23/R24). Policy sections follow STD-02's copy of
# Orbit's deny.toml. Every exception carries a reason and a re-review date.

[advisories]
# A yanked crate can change under the locked graph without anyone editing code.
yanked = "deny"
ignore = [
    # chrono is unmaintained and every version is affected, so there is no
    # patched release to move to. Only office-core depends on it directly
    # (calendar and time handling). Remove this entry when office-core moves
    # to a maintained crate.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; it is a direct dependency of office-core only, which is a maintenance notice, not a known exploit. Re-review 2027-02-22." },
    # chrono-tz is unmaintained with no safe upgrade. Only office-core depends
    # on it directly (time-zone rules), and it leaves the tree with chrono.
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz is unmaintained with no safe upgrade; it is a direct dependency of office-core only, which is a maintenance notice, not a known exploit. Re-review 2027-02-22." },
]

[licenses]
# Only what the tree needs today; add a license with a comment naming the
# crate that brought it.
allow = [
    # MIT / Apache-2.0: clap, serde, serde_json, thiserror, time, tracing,
    # tempfile, rustix and their transitive dependencies.
    "MIT",
    "Apache-2.0",
    # MIT-0: borrow-or-share, pulled in by fluent-uri -> referencing -> jsonschema (office-models).
    "MIT-0",
    # Unicode-3.0: unicode-ident.
    "Unicode-3.0",
    # Zlib: foldhash, pulled in by hashbrown -> hashlink -> rusqlite (office-store).
    "Zlib",
    # ISC: ring, rustls, rustls-webpki and untrusted, pulled in by ureq (office-models).
    "ISC",
    # BSD-3-Clause: pulled in by ureq's rustls stack (office-models).
    "BSD-3-Clause",
    # CDLA-Permissive-2.0: webpki-roots root certificates, pulled in by ureq (office-models).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned satellites workspace dependency (cw-supervise) until crates are published
# (constellation docs/design/cw-supervise/1_scope.md). Re-review 2027-02-24.
allow-git = ["https://github.com/constellation-works/satellites"]
