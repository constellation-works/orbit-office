# cargo-deny policy (STD-02 R23, STD-05 R23/R24). Policy sections follow STD-02's copy of
# Orbit's deny.toml. Every exception carries a reason and a re-review date.

[advisories]
# A yanked crate can change under the locked graph without anyone editing code.
yanked = "deny"
ignore = [
    # { id = "RUSTSEC-YYYY-NNNN", reason = "<why it does not apply>. Re-review YYYY-MM-DD." },
]

[licenses]
# Only what the tree needs today; add a license with a comment naming the
# crate that brought it.
allow = [
    # MIT / Apache-2.0: clap, serde, serde_json, thiserror, time, tracing,
    # tempfile, rustix and their transitive dependencies.
    "MIT",
    "Apache-2.0",
    # MIT-0: borrow-or-share, pulled in by fluent-uri -> referencing -> jsonschema (office-models).
    "MIT-0",
    # Unicode-3.0: unicode-ident.
    "Unicode-3.0",
    # Zlib: foldhash, pulled in by hashbrown -> hashlink -> rusqlite (office-store).
    "Zlib",
    # ISC: ring, rustls, rustls-webpki and untrusted, pulled in by ureq (office-models).
    "ISC",
    # BSD-3-Clause: pulled in by ureq's rustls stack (office-models).
    "BSD-3-Clause",
    # CDLA-Permissive-2.0: webpki-roots root certificates, pulled in by ureq (office-models).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
